services:
  postgres:
    image: postgres:17
    container_name: interview-prep-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: interview_prep
    ports:
      # 5432 is already used on the dev machine, so expose on 5433.
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run once, when the data volume is first created.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d interview_prep']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
